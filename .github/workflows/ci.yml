name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Çekirdek testleri (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/SweepCore

  ios-build:
    name: iOS derlemesi
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build
          -project PhotoSweep.xcodeproj
          -scheme PhotoSweep
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
