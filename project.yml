# Xcode projesi bu dosyadan üretilir: `xcodegen generate`
# .xcodeproj depoya konmaz; birleştirme çakışması çıkarmaz.
name: PhotoSweep
options:
  bundleIdPrefix: com.basakrdnz
  deploymentTarget:
    iOS: "17.0"
packages:
  SweepCore:
    path: Packages/SweepCore
targets:
  PhotoSweep:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SweepCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.basakrdnz.photosweep
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_CFBundleDisplayName: Photo Sweep
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Kopya ve benzer fotoğrafları bulmak ve seçtiklerinizi silmek için fotoğraflarınıza erişim gerekiyor. Analiz tamamen telefonda yapılır."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
